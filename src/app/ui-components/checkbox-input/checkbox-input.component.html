<div class="wrapper">
    <label class="custom-checkbox">
        <input type="checkbox" [checked]="isChecked" (change)="toggleCheckbox()">
        <span class="checkmark"></span>
        <ng-content></ng-content>
    </label>
    <span (click)="toggleCheckbox()">{{text}} <a [href]="link" target="_blank" *ngIf="link!=''">Saznajte više</a> </span><span *ngIf="mandatory" class="star">*</span>

</div>
